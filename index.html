<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess My Number</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f6f3ea;
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        /* color: #000; */
        font-family: "Courier New", monospace;
        min-height: 100vh;
      }

      header {
        height: 400px;
        border-bottom: 5px solid #eee;
        position: relative;
        text-align: center;
      }

      .again {
        position: absolute;
        top: 18px;
        left: 12px;
        padding: 14px 30px;
        font-size: 22px;
        font-weight: bold;
        font-family: inherit;
        border: none;
        cursor: pointer;
        background-color: #000;
        color: #eee;
      }

      .range {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 20px;
        font-weight: bold;
      }

      h1 {
        padding-top: 120px;
        font-size: 50px;
        letter-spacing: 2px;
      }

      .number {
        position: absolute;
        bottom: -65px;
        left: 50%;
        transform: translateX(-50%);

        width: 150px;
        height: 125px;

        background-color: #222;
        color: #eee;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 70px;
        font-weight: bold;
      }

      main {
        display: flex;
        justify-content: center;
        gap: 75px;
        margin-top: 170px;
      }

      .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #000;
      }

      .guess {
        width: 255px;
        height: 110px;

        background-color: transparent;
        border: 4px solid #000;

        color: #000;
        font-size: 50px;
        text-align: center;
        font-family: inherit;
        outline: none;
      }

      .check {
        margin-top: 30px;
        padding: 17px 32px;

        background-color: #000;
        border: none;
        /* border: #000; */
        color: #eee;

        font-family: inherit;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
      }

      .right {
        width: 300px;
      }

      .message {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 80px;
      }

      .score,
      .highscore {
        font-size: 23px;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <button class="again">Again!</button>

      <p class="range">(Between 1 and 20)</p>

      <h1>Guess My Number!</h1>

      <div class="number">?</div>
    </header>

    <main>
      <section class="left">
        <input type="number" class="guess" />

        <button class="check">Check!</button>
      </section>

      <section class="right">
        <p class="message">Start guessing...</p>

        <p class="score">💯 Score: <span>20</span></p>

        <p class="highscore">
          🏅 Highscore: <span class="highscoreNum">0</span>
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
